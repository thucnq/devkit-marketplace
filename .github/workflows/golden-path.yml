name: golden-path
# Proves the template every project starts from is green: scaffold it exactly like /dk:new-project,
# then build and test it (Testcontainers runs on the hosted runner's Docker).
on:
  push:
    paths: ['plugins/dk/**', '.github/workflows/golden-path.yml']
  pull_request:
    paths: ['plugins/dk/**']
  workflow_dispatch:

concurrency:
  group: gp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Script syntax and lint
        run: |
          for f in plugins/dk/scripts/*.sh plugins/dk/templates/golden-path/deploy/*.sh; do bash -n "$f"; done
          python3 -m py_compile plugins/dk/scripts/*.py
          pwsh -NoProfile -File plugins/dk/tests/test_setup_wsl.ps1   # setup-wsl.ps1: parse, PS 5.1 syntax, .wslconfig editing
          shellcheck -S warning plugins/dk/scripts/*.sh plugins/dk/templates/golden-path/scripts/dev/*.sh \
            plugins/dk/templates/golden-path/tools/*.sh plugins/dk/templates/golden-path/.githooks/pre-commit
          pipx run pyflakes plugins/dk/scripts/*.py plugins/dk/tests/*.py
      - name: Template copies are in sync
        run: |
          cmp plugins/dk/scripts/ac-trace.py plugins/dk/templates/golden-path/tools/ac-trace.py
          cmp plugins/dk/scripts/check-migrations.sh plugins/dk/templates/golden-path/tools/check-migrations.sh
      - name: Hook and script regression tests (guard, evidence, migrations, ac-trace, gen-plan)
        run: python3 -m unittest discover -s plugins/dk/tests -v

  scaffold-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Scaffold sample project
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/plugins/dk/scripts/new-project.sh" sample-app vn.sample OWNER/devkit-marketplace
      - name: Backend verify -Pquality
        working-directory: ${{ runner.temp }}/sample-app
        run: |
          MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
          $MVN -B -ntp verify -Pquality
      - name: Frontend checks
        working-directory: ${{ runner.temp }}/sample-app/frontend
        run: npm ci && npm run typecheck && npm run lint && npm test -- --run && npm run build
      - name: Requirements traceability
        working-directory: ${{ runner.temp }}/sample-app
        run: python3 tools/ac-trace.py
