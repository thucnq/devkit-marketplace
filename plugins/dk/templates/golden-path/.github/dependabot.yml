version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: monthly }
    groups: { maven: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
