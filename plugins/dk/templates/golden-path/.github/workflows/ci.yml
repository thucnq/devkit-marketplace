name: CI
on:
  pull_request:
  push:
    branches: [main]

# Free plan: 2,000 private-repo minutes/month. Cancel superseded runs, skip unaffected jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "backend=true" >> $GITHUB_OUTPUT; echo "frontend=true" >> $GITHUB_OUTPUT; exit 0; fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "backend=$(echo "$files" | grep -qE '^(backend/|pom.xml|docs/acceptance/)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "frontend=$(echo "$files" | grep -qE '^(frontend/|docs/api/)' && echo true || echo false)" >> $GITHUB_OUTPUT

  requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Acceptance criteria traceability (every mandatory AC has a test)
        run: python3 tools/ac-trace.py
      - name: OpenAPI lint
        run: npx -y @redocly/cli@1 lint docs/api/openapi.yaml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build, tests (Testcontainers), JaCoCo, ArchUnit, Spotless, SpotBugs, PMD
        run: |
          MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
          $MVN -B -ntp verify -Pquality

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
