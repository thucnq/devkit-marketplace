name: CI
on:
  pull_request:
  push:
    branches: [main]

# Free plan: 2,000 private-repo minutes/month. Cancel superseded runs, skip unaffected jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "backend=true" >> $GITHUB_OUTPUT; echo "frontend=true" >> $GITHUB_OUTPUT; exit 0; fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "backend=$(echo "$files" | grep -qE '^(backend/|pom.xml|docs/acceptance/)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "frontend=$(echo "$files" | grep -qE '^(frontend/|docs/api/)' && echo true || echo false)" >> $GITHUB_OUTPUT

  requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Acceptance criteria traceability (every mandatory AC of a started feature has a test)
        # --started-only: features nobody has started yet are listed, not failed (CI matches the phase).
        # /dk:review and /dk:ship still enforce every mandatory AC.
        run: python3 tools/ac-trace.py --started-only
      - name: Migrations are expand-only and committed ones are untouched
        if: github.event_name == 'pull_request'
        run: bash tools/check-migrations.sh "${{ github.event.pull_request.base.sha }}" HEAD
      - name: OpenAPI lint
        run: npx -y @redocly/cli@1 lint docs/api/openapi.yaml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # gitleaks CLI instead of gitleaks-action: the action calls the PR API (needs extra token
      # permissions, fails on pull_request with contents:read) and runs on deprecated Node 20.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="$BASE..HEAD" .
          else
            ./gitleaks git --redact --no-banner --exit-code 1 .
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build, tests (Testcontainers), JaCoCo, ArchUnit, Spotless, SpotBugs, PMD
        run: |
          MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
          $MVN -B -ntp verify -Pquality

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
