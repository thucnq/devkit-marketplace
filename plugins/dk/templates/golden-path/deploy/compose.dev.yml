# Local development database only: docker compose -f deploy/compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goldenpath
      POSTGRES_USER: goldenpath
      POSTGRES_PASSWORD: goldenpath_dev
    ports:
      - "5432:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
volumes:
  dev-db:
